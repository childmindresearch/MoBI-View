name: Setup Python Virtual Environment
description: Sets up Python, installs uv, and creates the virtual environment with dependencies.

inputs:
  only-dev:
    description: Whether to install only dev dependencies
    default: 'false'
    required: false
  install-lsl:
    description: Whether to install LSL dependencies
    default: 'false'
    required: false
  resolution:
    description: Dependency resolution strategy
    default: 'highest'
    required: false
  python-version:
    description: Python version to use
    required: false
    default: ''
  

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        
    # Install system dependencies for LSL
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux' && inputs.install-lsl == 'true'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y cmake build-essential

    - name: Cache Homebrew packages
      if: runner.os == 'macOS'
      uses: actions/cache@v4
      id: cache-homebrew
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar/lsl
          /opt/homebrew/lib/liblsl.dylib
        key: brew-${{ runner.os }}-${{ hashFiles('.github/actions/setup-venv/action.yaml') }}

    - name: Install LSL (macOS)
      if: runner.os == 'macOS' && inputs.install-lsl == 'true'
      shell: bash
      run: |
        BREW_PREFIX=$(brew --prefix)
        
        # Check if LSL is already installed and working
        if ! brew list lsl &>/dev/null || ! ls "${BREW_PREFIX}/lib/liblsl.dylib" &>/dev/null; then
          echo "Installing LSL..."
          brew install labstreaminglayer/tap/lsl
        else
          echo "LSL already installed and library found"
        fi
        
        # Find and set the library path
        LSL_LIB=$(find "${BREW_PREFIX}" -name "liblsl.dylib" -type f 2>/dev/null | head -n 1)
        if [[ -n "$LSL_LIB" ]]; then
          echo "LSL library found at: $LSL_LIB"
          echo "PYLSL_LIB=$LSL_LIB" >> $GITHUB_ENV
        else
          echo "ERROR: LSL library not found after installation"
          find "${BREW_PREFIX}" -name "liblsl.*" -type f 2>/dev/null || true
          exit 1
        fi

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows' && inputs.install-lsl == 'true'
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: 'latest'
        
    # Install LSL if needed
    - name: Install LSL on Windows
      if: inputs.install-lsl == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        git clone --depth=1 https://github.com/sccn/liblsl.git
        cd liblsl
        mkdir build
        cd build
        cmake ..
        cmake --build . --config Release
        cmake --install . --config Release
        
        # Find and set the library path for pylsl
        $lslDll = Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "lsl.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($lslDll) {
          echo "LSL library found at: $($lslDll.FullName)"
          echo "PYLSL_LIB=$($lslDll.FullName)" >> $env:GITHUB_ENV
        } else {
          # Try the build directory
          $lslDll = Get-ChildItem -Path "$PWD" -Recurse -Filter "lsl.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lslDll) {
            echo "LSL library found at: $($lslDll.FullName)"
            echo "PYLSL_LIB=$($lslDll.FullName)" >> $env:GITHUB_ENV
          } else {
            echo "ERROR: lsl.dll not found"
            exit 1
          }
        }
    
    - name: Install LSL on Ubuntu
      if: inputs.install-lsl == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        git clone --depth=1 https://github.com/sccn/liblsl.git
        cd liblsl
        mkdir build && cd build
        cmake ..
        make -j
        sudo make install
        sudo ldconfig

    - name: Install dependencies
      shell: bash
      run: |-
        if [[ "${{ inputs.only-dev }}" == "true" ]]; then
          uv sync --only-dev --resolution=${{ inputs.resolution }}
        else
          uv sync --resolution=${{ inputs.resolution }}
        fi